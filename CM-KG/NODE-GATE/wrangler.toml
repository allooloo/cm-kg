# cmkg-node-gate — RCO-A-01 (DAY ORDER 3, 2026-10-24). Routes mcp.<cc>-cm-kg.ai/* on the twelve node zones, written by routes_gate.py (proving node nl first).
name = "cmkg-node-gate"
main = "worker/index.js"
compatibility_date = "2026-10-01"
account_id = "dd2832b36f171b815f84c8487aada36b"
workers_dev = false
[observability]
enabled = true

# X402-A-01 (2026-10-24): the shared x402 register
[[kv_namespaces]]
binding = "X402"
id = "dd183811c9b34c4db1a91029f5343fde"

# TMKT-02 (2026-11-01): the filer identities of the Target Market door (key filer:<sha256 of the value>; the value is never held in clear)
[[kv_namespaces]]
binding = "TM_FILERS"
id = "92ce6b39f3294602b91493c8b8d028c0"

[vars]
X402_FREE_PER_DAY = "100"
SIGN_NODES = "all"   # NODE-SIGN-01: nl proved 2026-10-24, then the fleet

BOOK_TTL = "300"   # BOOK-04: edge cache of the Book mirror reads, seconds
