name = "cm-kg-apex"
main = "index.js"
compatibility_date = "2026-01-01"
workers_dev = false

[assets]
directory = "./static"
binding = "ASSETS"

# X402-A-01 (2026-10-24): the shared x402 register (free-tier meters, counts of settlements and offers)
[[kv_namespaces]]
binding = "X402"
id = "dd183811c9b34c4db1a91029f5343fde"

# USR-03 (2026-11-11): the research page store (one page per issuer, key p:<cmr>; written by CM-KG\RAILS\research\publish.py)
[[kv_namespaces]]
binding = "RESEARCH"
id = "7d0e0e4a059e444982b5eb1cc500efc1"

# X402-A-01: the free tier, reads per agent per UTC day (the CEO sets N)
[vars]
X402_FREE_PER_DAY = "100"
