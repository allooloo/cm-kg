# ASOF-01 (2026-11-05): getasof-pages — the estate source (CM-KG\ESTATE, protocols.js wrapper) deployed under its own name and routed only on getasof.ai
# (@ and www); the door hosts (mcp., agent.) are the apex router. The three forwards (getasof.com/.org/.io) are whole-zone redirect rules, not routes here.
# No cron (estate-pages runs the status probe). STATUS read-only; X402 read-only for the receipts tile (the gate's counter tot:asof_receipts).
name = "getasof-pages"
main = "../../ESTATE/worker/protocols.js"
compatibility_date = "2026-09-01"
account_id = "dd2832b36f171b815f84c8487aada36b"
workers_dev = false
preview_urls = false

[assets]
directory = "../../ESTATE/public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true

[[kv_namespaces]]
binding = "STATUS"
id = "c651588272f14f3080c7dd99be21a4fd"

[[kv_namespaces]]
binding = "X402"
id = "dd183811c9b34c4db1a91029f5343fde"
