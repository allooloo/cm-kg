# DOORS-01 (2026-11-05): getdoors-pages — the estate source deployed under its own name and routed only on getfilings.ai, getticker.ai and getauditor.ai (@ and www);
# the door hosts (mcp., agent.) are the apex router; the forwards are whole-zone redirect rules, not routes here.
# No cron (estate-pages runs the status probe). STATUS read-only; X402 read-only for the receipts tiles (tot:<tool>_receipts).
name = "getdoors-pages"
main = "../../ESTATE/worker/protocols.js"
compatibility_date = "2026-09-01"
account_id = "dd2832b36f171b815f84c8487aada36b"
workers_dev = false
preview_urls = false

[assets]
directory = "../../ESTATE/public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true

[[kv_namespaces]]
binding = "STATUS"
id = "c651588272f14f3080c7dd99be21a4fd"

[[kv_namespaces]]
binding = "X402"
id = "dd183811c9b34c4db1a91029f5343fde"
