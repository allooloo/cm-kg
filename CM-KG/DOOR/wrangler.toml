name = "cm-kg-door"
main = "worker/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

# records and events live in D1 (database cm-kg, loaded by CM-KG\RAILS\door\load_d1.py); static = favicons only
[assets]
directory = "./static"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "cm-kg"
database_id = "fad284a8-9f96-4a2f-afd5-f364302828bc"

# generous per-IP limit, no keys
[[unsafe.bindings]]
name = "RL"
type = "ratelimit"
namespace_id = "1101"
simple = { limit = 600, period = 60 }

[observability]
enabled = true
