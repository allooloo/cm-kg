name = "ai-ask"
main = "worker/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[unsafe.bindings]]
name = "RL"
type = "ratelimit"
namespace_id = "1102"
simple = { limit = 120, period = 60 }

[vars]
DOOR_CA = "https://mcp.ca-cm-kg.ai"
DOOR_GLOBAL = "https://mcp.capitalmarketsknowledgegraph.ai"
CLAUDE_MODEL = "claude-sonnet-5"

[observability]
enabled = true
